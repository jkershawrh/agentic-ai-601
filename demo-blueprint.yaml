intent:
  primary_user: Platform engineers, SREs, security reviewers, and AI governance teams responsible for safe operational automation
  workload: One synthetic unhealthy-workload condition and one reversible restart runbook confined to a disposable lab namespace
  recognized_problem: Model confidence and a successful recommendation do not establish permission, bounded impact, correct execution, or safe recovery.
  audience_decision: Decide whether one versioned condition class has sufficient evidence for observe, recommend, human-approved simulation, or continued denial.
  desired_outcome: Produce a human-reviewed authority envelope and a complete Signal to Decision to Action to Validate to Learn record without granting production authority.
architecture:
  actors:
    - id: learner
      name: Platform reliability learner
      kind: human
      responsibility: Configure, challenge, and inspect the authority envelope and evidence record.
      status: verified
      source: lab-factory-roadmap.md Agentic AI 601 charter
    - id: reviewer
      name: Human authority reviewer
      kind: human-authority
      responsibility: Approve, suspend, demote, or reject the narrowly scoped authority envelope.
      status: verified
      source: agent-promotion ratification implementation and 601 charter
  runtime_objects:
    - id: signal-source
      name: Synthetic condition generator
      kind: evidence-source
      responsibility: Emit a versioned lab-only condition with provenance and correlation identity.
      status: implemented-in-601
      source: server/engine.ts
    - id: policy
      name: Deterministic policy engine
      kind: decision-service
      responsibility: Evaluate emergency stop, prerequisites, environment, class, allowlist, authority, approval, blast radius, concurrency, idempotency, and evidence in fixed order.
      status: implemented-in-601
      source: server/policy.ts and contracts/deterministic-policy.v1.json
    - id: authority-envelope
      name: Earned-authority envelope
      kind: governance-record
      responsibility: Bind authority to one class, runbook, target, environment, blast radius, reviewer, and expiry.
      status: implemented-as-research-contract
      source: contracts/authority-ladder.v1.json
    - id: executor
      name: Synthetic bounded executor
      kind: lab-simulator
      responsibility: Simulate one idempotent reversible restart against one synthetic workload; never call an external target.
      status: implemented-in-601
      source: server/engine.ts
    - id: validator
      name: Independent outcome validator
      kind: evaluation-service
      responsibility: Compare the expected and observed synthetic state and require rollback on failure.
      status: implemented-in-601
      source: server/engine.ts
    - id: evidence-store
      name: Hash-linked evidence record
      kind: append-only-research-pattern
      responsibility: Bind correlation, idempotency, decision, action, validation, learning, authority, and prior-record hash.
      status: implemented-as-local-research-pattern
      source: contracts/evidence-record.schema.json and server/engine.ts
  boundaries:
    - id: namespace-boundary
      name: Disposable lab namespace
      purpose: Reject every action target outside agentic-ai-601-lab-* and cap target count and concurrency at one.
      status: implemented-in-601
    - id: authority-boundary
      name: Human approval and emergency stop
      purpose: Keep promotion human-owned and allow immediate denial, rollback, and demotion.
      status: implemented-in-601
    - id: research-boundary
      name: Research versus product boundary
      purpose: Prevent GCL, passport, ledger, rossoctl, or OpenShell preview concepts from being presented as supported product capabilities.
      status: verified
  external_dependencies:
    - Independent Launchpad onboarding and certification after 401 and 501 prerequisites
    - Red Hat OpenShift namespace, RBAC, NetworkPolicy, quota, and admission controls on an approved target
    - Optional release-specific OpenShift sandboxed containers; OpenShell remains Developer Preview research only
  flows:
    - id: earned-authority-loop
      name: Signal to governed learning record
      status: implemented-rehearsal
      steps:
        - {from: learner, to: signal-source, purpose: choose one synthetic condition and stable correlation identity, protocol: HTTPS-JSON, evidence: signal-provenance}
        - {from: signal-source, to: policy, purpose: classify and evaluate the fixed policy order, protocol: in-process-contract, evidence: decision-and-risk}
        - {from: policy, to: authority-envelope, purpose: abstain, recommend, request approval, or permit lab simulation, protocol: versioned-policy, evidence: granted-stage}
        - {from: authority-envelope, to: reviewer, purpose: obtain single-use human approval for the synthetic simulation, protocol: approval-record, evidence: approval-identity}
        - {from: authority-envelope, to: executor, purpose: simulate one allowlisted reversible action inside the lab scope, protocol: in-process-simulator, evidence: action-receipt}
        - {from: executor, to: validator, purpose: independently compare expected and observed synthetic state, protocol: validation-contract, evidence: validation-result}
        - {from: validator, to: executor, purpose: trigger rollback when validation fails, protocol: rollback-contract, evidence: rollback-result}
        - {from: validator, to: evidence-store, purpose: append the complete result and any demotion trigger, protocol: hash-linked-JSON, evidence: record-hash}
        - {from: evidence-store, to: reviewer, purpose: support human review without automatic promotion, protocol: evidence-package, evidence: reviewer-disposition}
operational_pattern:
  name: Signal, Decide, Act, Validate, Learn
  rationale: Level 601 earns a narrowly scoped and revocable right to act; it does not demonstrate generic autonomy.
  steps:
    - id: signal
      name: Signal
      action: Collect raw and normalized condition evidence, provenance, taxonomy, and stable correlation without mutation.
      evidence: correlation ID, condition class, taxonomy version, extracted entities, and source state
    - id: decision
      name: Decision
      action: Evaluate class-specific quality and deterministic policy, then abstain, recommend, request approval, or permit synthetic simulation.
      evidence: policy version, ordered checks, risk class, confidence or abstention reason, and requested/granted authority
    - id: action
      name: Action
      action: Exercise one idempotent reversible runbook in one disposable lab namespace after single-use approval.
      evidence: approval identity, idempotency key, action parameters, before state, attempt count, target count, and timeout
    - id: validate
      name: Validate
      action: Independently verify expected state, side effects, and rollback criteria; roll back and demote on failure.
      evidence: after state, validation result, rollback receipt, emergency-stop state, and demotion reason
    - id: learn
      name: Learn
      action: Append the complete outcome and reviewer disposition; update evaluation data offline without self-modifying authority.
      evidence: record hash, prior hash, false-positive or false-negative disposition, evaluation-set version, and human review
  changed_condition: The validation-failure scenario replaces the successful synthetic restart condition, forcing rollback and automatic demotion through the same path.
  close: State that the factory evidence is complete while production execution, catalog certification, ordering, and promotion remain disabled.
