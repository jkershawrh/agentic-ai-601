decisions:
  - id: deterministic-admission
    owner: Versioned policy engine
    rule: Deny by default and evaluate the emergency stop before every other authority check.
    fail_closed: true
  - id: promotion
    owner: Named human reviewer through an independently certified process
    rule: Promotion is class-specific, evidence-based, time-bound, revocable, and never automatic.
    fail_closed: true
  - id: rollback-and-demotion
    owner: Independent validator and emergency-stop control
    rule: Failed validation triggers rollback and immediate demotion; the agent cannot suppress or rewrite the result.
    fail_closed: true
  - id: current-execution
    owner: Factory prerequisite gate
    rule: Real execution is disabled because Agentic AI 401 and 501 are not certified.
    fail_closed: true
ai_assessment:
  needed: optional
  kind: mixed
  rationale: An AI classifier may help with ambiguous extraction or explanation, but deterministic policy and human authority fully control action admission; the implemented rehearsal uses no model.
  tasks:
    - Optional classification or explanation when deterministic extraction is inconclusive
  inputs:
    - Approved signal and evidence identifiers only
  outputs:
    - Advisory condition proposal with calibrated confidence or abstention
  model_identity_source: Not configured; no model participates in the current rehearsal service
  hardware_identity_source: Not configured; no Intel performance or placement claim is made
  evidence_access:
    - Only the approved synthetic signal record
  action_authority: none
  validation:
    - Deterministic class-specific evaluation
    - Deterministic policy
    - Independent outcome validation
    - Human review
  fallback: Abstain or use deterministic classification; missing AI never expands authority.
  final_decision_owner: Human reviewer; Launchpad independently owns certification and promotion.
story_mapping:
  audience_question: What must an agent prove before it receives one narrow and revocable right to act?
  stakes:
    - Model confidence alone cannot establish authorization or safe impact.
    - Validation failure must remove authority faster than promotion grants it.
  architecture_flow_ids: [earned-authority-loop]
  live_proof_flow_ids: [earned-authority-loop]
  comparison: Recommendation versus human-approved simulation versus failed validation with rollback and demotion
  payoff: A complete research qualification record and explicit blockers, never unrestricted autonomy
  next_journey: Independent Launchpad intake after Agentic AI 401 and 501 certification
